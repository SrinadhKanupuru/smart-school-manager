name: smart_school
description: "A multi-tenant, role-based Smart School Management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  file_picker: ^11.0.2
  dio: ^5.4.0
  geolocator: ^11.0.0
  camera: ^0.10.5+7
  google_mlkit_face_detection: ^0.13.2
  google_maps_flutter: ^2.5.3
  socket_io_client: ^2.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bus_marker.png
